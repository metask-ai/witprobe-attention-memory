name: lean
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 1"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
      - name: Mathlib cache
        run: cd formal && ~/.elan/bin/lake exe cache get || true
      - name: Full formal gate
        run: cd formal && bash check_all.sh
